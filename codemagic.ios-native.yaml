workflows:
  partenairefoyer-ios-native:
    name: PartenaireFoyer iOS natif
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: partenairefoyer_app_store_connect

    environment:
      xcode: latest
      groups:
        - firebase_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.partenairefoyer.app
      vars:
        XCODE_PROJECT: "ios-native/PartenaireFoyer.xcodeproj"
        XCODE_SCHEME: "PartenaireFoyer"

    scripts:
      - name: Configurer la signature Apple
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Préparer la configuration Firebase iOS
        script: |
          chmod +x ./scripts/prepare-ios-firebase.sh
          ./scripts/prepare-ios-firebase.sh

      - name: Préparer le logo et l’icône iOS
        script: |
          chmod +x ./scripts/prepare-ios-assets.sh
          ./scripts/prepare-ios-assets.sh

      - name: Compiler l’IPA iOS
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
