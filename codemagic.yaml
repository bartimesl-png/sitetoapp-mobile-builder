workflows:

  # ============================================================
  # WORKFLOW 1
  # BUILD DE TEST UTILISÉ PAR SITETOAPP
  # ============================================================

  android-test:

    name: SiteToApp Android

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      node: 22
      java: 21

      vars:
        APP_NAME: "SiteToApp"
        APP_PACKAGE_ID: "com.sitetoapp.generated"
        APP_WEBSITE_URL: "https://example.com"
        APP_ICON_URL: "https://example.com/icon.png"
        APP_THEME_COLOR: "#0A84FF"
        APPLICATION_ID: "default-application"
        REQUESTED_BUILD_ID: "default-build"

        APP_VERSION_CODE: "2"
        APP_VERSION_NAME: "1.1"

    scripts:

      - name: Installer les dépendances
        script: |
          npm install
          npm install --save-dev @capacitor/assets


      - name: Vérifier les variables reçues
        script: |
          echo "APP_NAME=$APP_NAME"
          echo "APP_PACKAGE_ID=$APP_PACKAGE_ID"
          echo "APP_WEBSITE_URL=$APP_WEBSITE_URL"
          echo "APP_ICON_URL=$APP_ICON_URL"
          echo "APPLICATION_ID=$APPLICATION_ID"
          echo "REQUESTED_BUILD_ID=$REQUESTED_BUILD_ID"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE"
          echo "APP_VERSION_NAME=$APP_VERSION_NAME"


      - name: Créer le projet Android
        script: |
          rm -rf android
          npx cap add android


      - name: Synchroniser Capacitor
        script: |
          npx cap sync android


      - name: Configurer version Android
        script: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version_code = os.environ.get("APP_VERSION_CODE", "2")
          version_name = os.environ.get("APP_VERSION_NAME", "1.1")

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle introuvable")

          text = path.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              text
          )

          text = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              f'versionName "{version_name}"',
              text
          )

          path.write_text(text)

          print("Version Android configurée :")
          print("versionCode =", version_code)
          print("versionName =", version_name)
          PY


      - name: Ajouter permission notifications Android
        script: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml introuvable"
              )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:
              text = text.replace(
                  "<application",
                  permission + "\n\n    <application",
                  1
              )

          manifest.write_text(text)

          print(
              "Permission POST_NOTIFICATIONS vérifiée."
          )
          PY


      - name: Télécharger le logo
        script: |
          rm -rf assets
          mkdir -p assets

          if [ -n "$APP_ICON_URL" ] && \
             [ "$APP_ICON_URL" != "https://example.com/icon.png" ]; then

            curl -L \
              --fail \
              --retry 3 \
              "$APP_ICON_URL" \
              -o assets/icon.png

            echo "Logo téléchargé"
            ls -lh assets/icon.png

          else

            echo "Pas de logo personnalisé reçu"

          fi


      - name: Générer les icônes Android
        script: |
          if [ -f "assets/icon.png" ]; then

            npx @capacitor/assets generate \
              --android \
              --assetPath assets \
              --iconBackgroundColor "#FFFFFF" \
              --iconBackgroundColorDark "#FFFFFF"

          else

            echo "Génération icône ignorée"

          fi


      - name: Vérifier configuration Android
        script: |
          echo "===== VERSION ====="

          grep -n "versionCode" \
            android/app/build.gradle || true

          grep -n "versionName" \
            android/app/build.gradle || true

          echo "===== PACKAGE ====="

          grep -n "applicationId" \
            android/app/build.gradle || true

          echo "===== PERMISSIONS ====="

          grep -n "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml || true


      - name: Compiler APK Android
        script: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug


    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/outputs/**/output-metadata.json


    publishing:

      scripts:

        - name: Enregistrer APK dans Supabase
          script: |
            echo "===== PUBLICATION SITETOAPP ====="

            echo "CM_BUILD_ID=$CM_BUILD_ID"
            echo "APPLICATION_ID=$APPLICATION_ID"
            echo "REQUESTED_BUILD_ID=$REQUESTED_BUILD_ID"

            APK_URL=$(echo "$CM_ARTIFACT_LINKS" | jq -r \
              '.[] | select(.name | endswith(".apk")) | .url' \
              | head -n 1)

            if [ "$APK_URL" = "null" ]; then
              APK_URL=""
            fi

            if [ -z "$APK_URL" ]; then
              echo "Aucun APK trouvé"
              exit 0
            fi

            PAYLOAD=$(jq -n \
              --arg buildId "$CM_BUILD_ID" \
              --arg requestedBuildId "$REQUESTED_BUILD_ID" \
              --arg applicationId "$APPLICATION_ID" \
              --arg status "finished" \
              --arg apkArtifactUrl "$APK_URL" \
              '{
                buildId: $buildId,
                requestedBuildId: $requestedBuildId,
                applicationId: $applicationId,
                status: $status,
                apkArtifactUrl: $apkArtifactUrl
              }')

            curl \
              --fail-with-body \
              --retry 3 \
              --retry-delay 2 \
              -X POST \
              "https://krvwwavxmuwieemubhdj.supabase.co/functions/v1/codemagic-artifact-register" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"



  # ============================================================
  # WORKFLOW 2
  # VERSION RELEASE GOOGLE PLAY
  # ============================================================

  android-release:

    name: PartenaireFoyer Google Play 1.1

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      node: 22
      java: 21

      android_signing:
        - partenairefoyer

      vars:
        APP_NAME: "PartenaireFoyer"

        APP_PACKAGE_ID:
          "com.sitetoapp.partenairefoyercom28231c01"

        APP_WEBSITE_URL:
          "https://www.partenairefoyer.com/"

        APP_ICON_URL:
          "https://static.wixstatic.com/media/476a15_d601a17fe7c4406aac35fac85d309948~mv2.jpg"

        APP_THEME_COLOR: "#007AFF"

        APPLICATION_ID:
          "d37e96ce-285c-44ba-8fdc-8ee85abc62d0"

        REQUESTED_BUILD_ID:
          "partenairefoyer-release-1-1"

        APP_VERSION_CODE: "2"
        APP_VERSION_NAME: "1.1"


    scripts:

      - name: Installer les dépendances
        script: |
          npm install
          npm install --save-dev @capacitor/assets


      - name: Vérifier configuration release
        script: |
          echo "APP_NAME=$APP_NAME"
          echo "APP_PACKAGE_ID=$APP_PACKAGE_ID"
          echo "APP_WEBSITE_URL=$APP_WEBSITE_URL"

          echo "VERSION CODE=$APP_VERSION_CODE"
          echo "VERSION NAME=$APP_VERSION_NAME"

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERREUR : keystore absent"
            exit 1
          fi

          if [ -z "$CM_KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : mot de passe keystore absent"
            exit 1
          fi

          if [ -z "$CM_KEY_ALIAS" ]; then
            echo "ERREUR : alias keystore absent"
            exit 1
          fi

          if [ -z "$CM_KEY_PASSWORD" ]; then
            echo "ERREUR : mot de passe clé absent"
            exit 1
          fi


      - name: Créer projet Android
        script: |
          rm -rf android

          npx cap add android


      - name: Synchroniser Capacitor
        script: |
          npx cap sync android


      - name: Configurer version 1.1
        script: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          version_code = os.environ.get(
              "APP_VERSION_CODE",
              "2"
          )

          version_name = os.environ.get(
              "APP_VERSION_NAME",
              "1.1"
          )

          path = Path(
              "android/app/build.gradle"
          )

          if not path.exists():
              raise SystemExit(
                  "build.gradle introuvable"
              )

          text = path.read_text()

          text = re.sub(
              r'versionCode\s+\d+',
              f'versionCode {version_code}',
              text
          )

          text = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              f'versionName "{version_name}"',
              text
          )

          path.write_text(text)

          print(
              f"VERSION = {version_name} ({version_code})"
          )
          PY


      - name: Configurer Android API 36
        script: |
          if [ -f "android/variables.gradle" ]; then

            sed -i.bak \
              's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' \
              android/variables.gradle

            sed -i.bak \
              's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' \
              android/variables.gradle

          fi


      - name: Ajouter permission notifications
        script: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml introuvable"
              )

          text = manifest.read_text()

          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )

          if permission not in text:

              text = text.replace(
                  "<application",
                  permission + "\n\n    <application",
                  1
              )

          manifest.write_text(text)

          print(
              "POST_NOTIFICATIONS ajouté"
          )
          PY


      - name: Télécharger logo PartenaireFoyer
        script: |
          rm -rf assets
          mkdir -p assets

          curl -L \
            --fail \
            --retry 3 \
            "$APP_ICON_URL" \
            -o assets/icon.png

          ls -lh assets/icon.png


      - name: Générer vraie icône Android
        script: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#FFFFFF" \
            --iconBackgroundColorDark "#FFFFFF"


      - name: Configurer signature release
        script: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/build.gradle"
          )

          if not path.exists():
              raise SystemExit(
                  "build.gradle introuvable"
              )

          text = path.read_text()

          if "signingConfigs {" not in text:

              text = text.replace(
                  "android {",
                  """android {

              signingConfigs {
                  release {
                      storeFile file(
                          System.getenv(
                              "CM_KEYSTORE_PATH"
                          )
                      )

                      storePassword System.getenv(
                          "CM_KEYSTORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "CM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "CM_KEY_PASSWORD"
                      )
                  }
              }
              """,
                  1
              )

          if (
              "signingConfig signingConfigs.release"
              not in text
          ):

              text = text.replace(
                  "release {",
                  """release {
                      signingConfig signingConfigs.release
                  """,
                  1
              )

          path.write_text(text)

          print(
              "Signature release configurée"
          )
          PY


      - name: Vérification finale
        script: |
          echo "===== BUILD.GRADLE ====="

          grep -n "applicationId" \
            android/app/build.gradle || true

          grep -n "versionCode" \
            android/app/build.gradle || true

          grep -n "versionName" \
            android/app/build.gradle || true

          grep -n "signingConfig" \
            android/app/build.gradle || true

          echo "===== MANIFEST ====="

          grep -n "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml || true


      - name: Compiler APK release
        script: |
          cd android

          chmod +x gradlew

          ./gradlew assembleRelease


      - name: Compiler AAB Google Play
        script: |
          cd android

          chmod +x gradlew

          ./gradlew bundleRelease


    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/outputs/**/output-metadata.json
