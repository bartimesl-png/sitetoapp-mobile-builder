workflows:

  android-release:

    name: SiteToApp Android Release

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      node: 22
      java: 21

      android_signing:
        - partenairefoyer

      vars:
        APP_NAME: "Partenairefoyer.com"
        APP_PACKAGE_ID: "com.sitetoapp.partenairefoyercom28231c01"
        APP_WEBSITE_URL: "https://www.partenairefoyer.com/"
        APP_ICON_URL: "https://static.wixstatic.com/media/476a15_d601a17fe7c4406aac35fac85d309948~mv2.jpg"
        APP_THEME_COLOR: "#007AFF"
        APPLICATION_ID: "d37e96ce-285c-44ba-8fdc-8ee85abc62d0"
        REQUESTED_BUILD_ID: "manual-release"
        ANDROID_TARGET_SDK: "36"
        ANDROID_COMPILE_SDK: "36"

    scripts:

      - name: Installer les dépendances
        script: |
          npm install

      - name: Vérifier la configuration
        script: |
          echo "APP_NAME=$APP_NAME"
          echo "APP_PACKAGE_ID=$APP_PACKAGE_ID"
          echo "APP_WEBSITE_URL=$APP_WEBSITE_URL"
          echo "ANDROID_TARGET_SDK=$ANDROID_TARGET_SDK"
          echo "ANDROID_COMPILE_SDK=$ANDROID_COMPILE_SDK"

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERREUR : keystore Codemagic introuvable."
            exit 1
          fi

          if [ -z "$CM_KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : mot de passe keystore absent."
            exit 1
          fi

          if [ -z "$CM_KEY_ALIAS" ]; then
            echo "ERREUR : alias de clé absent."
            exit 1
          fi

          if [ -z "$CM_KEY_PASSWORD" ]; then
            echo "ERREUR : mot de passe de clé absent."
            exit 1
          fi

      - name: Créer le projet Android
        script: |
          rm -rf android
          npx cap add android

      - name: Synchroniser Capacitor
        script: |
          npx cap sync android

      - name: Configurer Android API 36
        script: |
          if [ -f "android/variables.gradle" ]; then
            sed -i.bak \
              's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' \
              android/variables.gradle

            sed -i.bak \
              's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' \
              android/variables.gradle
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i.bak \
              's/compileSdk [0-9]*/compileSdk 36/' \
              android/app/build.gradle || true

            sed -i.bak \
              's/targetSdk [0-9]*/targetSdk 36/' \
              android/app/build.gradle || true
          fi

      - name: Configurer la signature Release
        script: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if not path.exists():
              raise SystemExit("android/app/build.gradle introuvable")

          text = path.read_text()

          if "signingConfigs {" not in text:
              marker = "android {"

              signing = r'''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              '''

              text = text.replace(
                  marker,
                  marker + signing,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "release {",
                  """release {
                      signingConfig signingConfigs.release
                  """,
                  1
              )

          path.write_text(text)
          PY

      - name: Vérifier la configuration Gradle
        script: |
          echo "===== android/app/build.gradle ====="
          cat android/app/build.gradle

          echo "===== android/variables.gradle ====="
          if [ -f "android/variables.gradle" ]; then
            cat android/variables.gradle
          fi

      - name: Compiler APK Release signé
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Compiler AAB Google Play signé
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/outputs/**/output-metadata.json
