workflows:

  generate-play-keystore:

    name: Générer keystore Google Play

    instance_type: mac_mini_m2

    max_build_duration: 10

    environment:
      java: 21

      vars:
        KEYSTORE_PASSWORD: "NINO2027"
        KEY_PASSWORD: "2026NINO"
        KEY_ALIAS: "partenairefoyer"

    scripts:

      - name: Générer le keystore PKCS12
        script: |
          keytool \
            -genkeypair \
            -v \
            -keystore partenairefoyer.keystore \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=PartenaireFoyer, OU=SiteToApp, O=PartenaireFoyer, L=Bouvron, ST=Loire-Atlantique, C=FR"

      - name: Vérifier le keystore
        script: |
          keytool \
            -list \
            -v \
            -keystore partenairefoyer.keystore \
            -storepass "$KEYSTORE_PASSWORD"

    artifacts:
      - partenairefoyer.keystore
