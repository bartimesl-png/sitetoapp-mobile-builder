workflows:

  android-test:

    name: SiteToApp Android Test

    max_build_duration: 30

    instance_type: linux_x2

    environment:

      node: 22

      java: 21

      vars:

        APP_NAME: "PartenaireFoyer"

        APP_PACKAGE_ID: "com.partenairefoyer.app"

        APP_WEBSITE_URL: "https://www.partenairefoyer.com"

    scripts:

      - name: Installer les dépendances
        script: |
          npm install

      - name: Créer le projet Android
        script: |
          rm -rf android
          npx cap add android

      - name: Synchroniser Capacitor
        script: |
          npx cap sync android

      - name: Compiler APK Debug
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:

      - android/app/build/outputs/**/*.apk

      - android/app/build/outputs/**/*.aab

      - android/app/build/outputs/**/mapping.txt

      - android/app/build/outputs/**/output-metadata.json