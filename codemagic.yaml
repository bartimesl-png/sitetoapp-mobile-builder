workflows:

  android-test:

    name: SiteToApp Android

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      node: 22
      java: 21

      vars:
        APP_NAME: "SiteToApp"
        APP_PACKAGE_ID: "com.sitetoapp.generated"
        APP_WEBSITE_URL: "https://example.com"
        APP_ICON_URL: "https://example.com/icon.png"
        APP_THEME_COLOR: "#0A84FF"
        APPLICATION_ID: "default-application"
        REQUESTED_BUILD_ID: "default-build"

    scripts:

      - name: Installer les dépendances
        script: |
          npm install

      - name: Créer le projet Android
        script: |
          rm -rf android
          npx cap add android

      - name: Synchroniser Capacitor
        script: |
          npx cap sync android

      - name: Compiler APK Android
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          touch "$HOME/SITETOAPP_BUILD_SUCCESS"

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/outputs/**/output-metadata.json

    publishing:

      scripts:

        - name: Enregistrer l'APK dans Supabase
          script: |
            STATUS="failed"
            APK_URL=""
            AAB_URL=""

            if [ -f "$HOME/SITETOAPP_BUILD_SUCCESS" ]; then
              STATUS="finished"

              APK_URL=$(echo "$CM_ARTIFACT_LINKS" | jq -r \
                '.[] | select(.name | endswith(".apk")) | .url' \
                | head -n 1)

              AAB_URL=$(echo "$CM_ARTIFACT_LINKS" | jq -r \
                '.[] | select(.name | endswith(".aab")) | .url' \
                | head -n 1)

              if [ "$APK_URL" = "null" ]; then
                APK_URL=""
              fi

              if [ "$AAB_URL" = "null" ]; then
                AAB_URL=""
              fi

              if [ -z "$APK_URL" ]; then
                STATUS="failed"
              fi
            fi

            PAYLOAD=$(jq -n \
              --arg buildId "$CM_BUILD_ID" \
              --arg requestedBuildId "$REQUESTED_BUILD_ID" \
              --arg applicationId "$APPLICATION_ID" \
              --arg status "$STATUS" \
              --arg apkArtifactUrl "$APK_URL" \
              --arg aabArtifactUrl "$AAB_URL" \
              '{
                buildId: $buildId,
                requestedBuildId: $requestedBuildId,
                applicationId: $applicationId,
                status: $status,
                apkArtifactUrl: $apkArtifactUrl,
                aabArtifactUrl: $aabArtifactUrl
              }')

            curl \
              --fail-with-body \
              --retry 3 \
              --retry-delay 2 \
              -X POST \
              "https://krvwwavxmuwieemubhdj.supabase.co/functions/v1/codemagic-artifact-register" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"


  android-release:

    name: PartenaireFoyer Google Play Release

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      node: 22
      java: 21

      android_signing:
        - partenairefoyer_keystore

      vars:
        APP_NAME: "Partenairefoyer.com"
        APP_PACKAGE_ID: "com.sitetoapp.partenairefoyercom28231c01"
        APP_WEBSITE_URL: "https://www.partenairefoyer.com/"
        APP_ICON_URL: "https://static.wixstatic.com/media/476a15_d601a17fe7c4406aac35fac85d309948~mv2.jpg"
        APP_THEME_COLOR: "#007AFF"

    scripts:

      - name: Installer les dépendances
        script: |
          npm install

      - name: Vérifier le keystore
        script: |
          echo "Vérification de la signature Android..."

          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERREUR : CM_KEYSTORE_PATH absent"
            exit 1
          fi

          if [ -z "$CM_KEYSTORE_PASSWORD" ]; then
            echo "ERREUR : CM_KEYSTORE_PASSWORD absent"
            exit 1
          fi

          if [ -z "$CM_KEY_ALIAS" ]; then
            echo "ERREUR : CM_KEY_ALIAS absent"
            exit 1
          fi

          if [ -z "$CM_KEY_PASSWORD" ]; then
            echo "ERREUR : CM_KEY_PASSWORD absent"
            exit 1
          fi

          echo "Keystore trouvé."
          echo "Alias : $CM_KEY_ALIAS"

      - name: Créer le projet Android
        script: |
          rm -rf android
          npx cap add android

      - name: Synchroniser Capacitor
        script: |
          npx cap sync android

      - name: Installer Android API 36
        script: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" || true

      - name: Configurer Android Release
        script: |
          cat > android/app/codemagic-release.gradle <<'EOF'
          android {

              compileSdk 36

              defaultConfig {
                  targetSdk 36
              }

              signingConfigs {

                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }

              }

              buildTypes {

                  release {
                      signingConfig signingConfigs.release
                  }

              }

          }
          EOF

          echo "" >> android/app/build.gradle
          echo 'apply from: "codemagic-release.gradle"' >> android/app/build.gradle

          echo "===== Configuration Release ajoutée ====="
          cat android/app/codemagic-release.gradle

      - name: Vérifier Gradle
        script: |
          cd android
          chmod +x gradlew

          ./gradlew :app:tasks --all >/dev/null

          echo "Configuration Gradle valide."

      - name: Compiler APK Release
        script: |
          cd android
          chmod +x gradlew

          ./gradlew assembleRelease

      - name: Compiler AAB Google Play
        script: |
          cd android
          chmod +x gradlew

          ./gradlew bundleRelease

      - name: Vérifier les fichiers Release
        script: |
          echo "===== APK ====="
          find android/app/build/outputs -type f -name "*.apk" -print

          echo "===== AAB ====="
          find android/app/build/outputs -type f -name "*.aab" -print

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/outputs/**/output-metadata.json
