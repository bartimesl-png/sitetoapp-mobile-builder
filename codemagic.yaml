workflows:

  # ============================================================
  # WORKFLOW 1
  # BUILD DE TEST UTILISÉ PAR SITETOAPP
  # ============================================================

  android-test:

    name: SiteToApp Android

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:
      node: 22
      java: 21

      vars:
        APP_NAME: "SiteToApp"
        APP_PACKAGE_ID: "com.sitetoapp.generated"
        APP_WEBSITE_URL: "https://example.com"
        APP_ICON_URL: "https://example.com/icon.png"
        APP_THEME_COLOR: "#0A84FF"
        APPLICATION_ID: "default-application"
        REQUESTED_BUILD_ID: "default-build"

    scripts:

      - name: Installer les dépendances
        script: |
          npm install

      - name: Créer le projet Android
        script: |
          rm -rf android
          npx cap add android

      - name: Synchroniser Capacitor
        script: |
          npx cap sync android

      - name: Compiler APK Android
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          touch "$HOME/SITETOAPP_BUILD_SUCCESS"

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
      - android/app/build/outputs/**/output-metadata.json

    publishing:

      scripts:

        - name: Enregistrer l'APK dans Supabase
          script: |
            STATUS="failed"
            APK_URL=""
            AAB_URL=""

            if [ -f "$HOME/SITETOAPP_BUILD_SUCCESS" ]; then
              STATUS="finished"

              APK_URL=$(echo "$CM_ARTIFACT_LINKS" | jq -r \
                '.[] | select(.name | endswith(".apk")) | .url' \
                | head -n 1)

              AAB_URL=$(echo "$CM_ARTIFACT_LINKS" | jq -r \
                '.[] | select(.name | endswith(".aab")) | .url' \
                | head -n 1)

              if [ "$APK_URL" = "null" ]; then
                APK_URL=""
              fi

              if [ "$AAB_URL" = "null" ]; then
                AAB_URL=""
              fi

              if [ -z "$APK_URL" ]; then
                STATUS="failed"
              fi
            fi

            PAYLOAD=$(jq -n \
              --arg buildId "$CM_BUILD_ID" \
              --arg requestedBuildId "$REQUESTED_BUILD_ID" \
              --arg applicationId "$APPLICATION_ID" \
              --arg status "$STATUS" \
              --arg apkArtifactUrl "$APK_URL" \
              --arg aabArtifactUrl "$AAB_URL" \
              '{
                buildId: $buildId,
                requestedBuildId: $requestedBuildId,
                applicationId: $applicationId,
                status: $status,
                apkArtifactUrl: $apkArtifactUrl,
                aabArtifactUrl: $aabArtifactUrl
              }')

            curl \
              --fail-with-body \
              --retry 3 \
              --retry-delay 2 \
              -X POST \
              "https://krvwwavxmuwieemubhdj.supabase.co/functions/v1/codemagic-artifact-register" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"


  # ============================================================
  # WORKFLOW iOS NATIF PARTENAIREFOYER
  # ============================================================

  partenairefoyer-ios-native:

    name: PartenaireFoyer iOS natif

    max_build_duration: 120

    instance_type: mac_mini_m2

    integrations:
      app_store_connect: partenairefoyer_app_store_connect

    environment:
      xcode: latest
      groups:
        - firebase_ios

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.partenairefoyer.app

      vars:
        XCODE_PROJECT: "ios-native/PartenaireFoyer.xcodeproj"
        XCODE_SCHEME: "PartenaireFoyer"

    scripts:

      - name: Configurer la signature Apple
        script: |
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"

      - name: Préparer la configuration Firebase iOS
        script: |
          chmod +x ./scripts/prepare-ios-firebase.sh
          ./scripts/prepare-ios-firebase.sh

      - name: Préparer les assets iOS manquants
        script: |
          chmod +x ./scripts/prepare-ios-assets.sh
          export PARTENAIREFOYER_LOGO_URL="https://static.wixstatic.com/media/476a15_d601a17fe7c4406aac35fac85d309948~mv2.jpg"
          ./scripts/prepare-ios-assets.sh

      - name: Compiler l’IPA iOS
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: true
        release_type: MANUAL
