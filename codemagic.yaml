workflows:

  # ============================================================
  # WORKFLOW 1
  # TEST ANDROID UTILISÉ PAR SITETOAPP
  #
  # IMPORTANT :
  # On conserve ce workflow pour ne pas casser le fonctionnement
  # actuel SiteToApp -> Codemagic -> Supabase -> APK.
  # ============================================================

  android-test:

    name: SiteToApp Android

    instance_type: mac_mini_m2

    max_build_duration: 30

    environment:

      node: 22

      java: 21

      vars:

        APP_NAME: "SiteToApp"

        APP_PACKAGE_ID: "com.sitetoapp.generated"

        APP_WEBSITE_URL: "https://example.com"

        APP_ICON_URL: "https://example.com/icon.png"

        APP_THEME_COLOR: "#0A84FF"

        APPLICATION_ID: "default-application"

        REQUESTED_BUILD_ID: "default-build"


    scripts:


      - name: Installer les dépendances

        script: |

          npm install


      - name: Créer le projet Android

        script: |

          rm -rf android

          npx cap add android


      - name: Synchroniser Capacitor

        script: |

          npx cap sync android


      - name: Compiler APK Android

        script: |

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug

          touch "$HOME/SITETOAPP_BUILD_SUCCESS"


    artifacts:

      - android/app/build/outputs/**/*.apk

      - android/app/build/outputs/**/*.aab

      - android/app/build/outputs/**/mapping.txt

      - android/app/build/outputs/**/output-metadata.json


    publishing:

      scripts:


        - name: Enregistrer l'APK dans Supabase

          script: |

            STATUS="failed"

            APK_URL=""

            AAB_URL=""


            if [ -f "$HOME/SITETOAPP_BUILD_SUCCESS" ]; then

              STATUS="finished"


              APK_URL=$(echo "$CM_ARTIFACT_LINKS" | jq -r \
                '.[] | select(.name | endswith(".apk")) | .url' \
                | head -n 1)


              AAB_URL=$(echo "$CM_ARTIFACT_LINKS" | jq -r \
                '.[] | select(.name | endswith(".aab")) | .url' \
                | head -n 1)


              if [ "$APK_URL" = "null" ]; then

                APK_URL=""

              fi


              if [ "$AAB_URL" = "null" ]; then

                AAB_URL=""

              fi


              if [ -z "$APK_URL" ]; then

                STATUS="failed"

              fi

            fi


            PAYLOAD=$(jq -n \
              --arg buildId "$CM_BUILD_ID" \
              --arg requestedBuildId "$REQUESTED_BUILD_ID" \
              --arg applicationId "$APPLICATION_ID" \
              --arg status "$STATUS" \
              --arg apkArtifactUrl "$APK_URL" \
              --arg aabArtifactUrl "$AAB_URL" \
              '{
                buildId: $buildId,
                requestedBuildId: $requestedBuildId,
                applicationId: $applicationId,
                status: $status,
                apkArtifactUrl: $apkArtifactUrl,
                aabArtifactUrl: $aabArtifactUrl
              }')


            curl \
              --fail-with-body \
              --retry 3 \
              --retry-delay 2 \
              -X POST \
              "https://krvwwavxmuwieemubhdj.supabase.co/functions/v1/codemagic-artifact-register" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"



  # ============================================================
  # WORKFLOW 2
  # VRAIE APPLICATION PARTENAIREFOYER
  # GOOGLE PLAY / RELEASE / FIREBASE / PUSH
  # ============================================================

  android-release:

    name: PartenaireFoyer Google Play Release

    instance_type: mac_mini_m2

    max_build_duration: 45


    environment:

      node: 22

      java: 21


      # IMPORTANT :
      # Nom de référence actuellement présent dans ton ancien YAML.
      android_signing:

        - partenairefoyer_release_2026


      vars:

        APP_NAME: "PartenaireFoyer"

        APP_PACKAGE_ID: "com.sitetoapp.partenairefoyercom28231c01"

        APP_WEBSITE_URL: "https://www.partenairefoyer.com/"

        APP_ICON_URL: "https://static.wixstatic.com/media/476a15_d601a17fe7c4406aac35fac85d309948~mv2.jpg"

        APP_THEME_COLOR: "#007AFF"

        APPLICATION_ID: "d37e96ce-285c-44ba-8fdc-8ee85abc62d0"

        REQUESTED_BUILD_ID: "google-play-release"

        ANDROID_COMPILE_SDK: "36"

        ANDROID_TARGET_SDK: "36"

        APP_VERSION_CODE: "1"

        APP_VERSION_NAME: "1.0.0"



    scripts:


      # ========================================================
      # 1 - DÉPENDANCES
      # ========================================================

      - name: Installer les dépendances du projet

        script: |

          set -e

          echo "===== INSTALLATION PROJET ====="

          npm install


          echo "===== VERSION CAPACITOR ====="

          CAP_MAJOR=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")

          echo "Capacitor major = $CAP_MAJOR"


          echo "===== INSTALLATION PUSH ====="

          npm install \
            "@capacitor/push-notifications@$CAP_MAJOR" \
            "@capacitor/splash-screen@$CAP_MAJOR"


          echo "===== INSTALLATION ASSETS ====="

          npm install --save-dev @capacitor/assets


          echo "===== VÉRIFICATIONS ====="

          npm list @capacitor/core --depth=0

          npm list @capacitor/push-notifications --depth=0

          npm list @capacitor/splash-screen --depth=0

          npm list @capacitor/assets --depth=0



      # ========================================================
      # 2 - SIGNATURE
      # ========================================================

      - name: Vérifier le keystore Google Play

        script: |

          set -e

          echo "===== SIGNATURE ANDROID ====="


          if [ -z "$CM_KEYSTORE_PATH" ]; then

            echo "ERREUR : CM_KEYSTORE_PATH absent"

            exit 1

          fi


          if [ -z "$CM_KEYSTORE_PASSWORD" ]; then

            echo "ERREUR : CM_KEYSTORE_PASSWORD absent"

            exit 1

          fi


          if [ -z "$CM_KEY_ALIAS" ]; then

            echo "ERREUR : CM_KEY_ALIAS absent"

            exit 1

          fi


          if [ -z "$CM_KEY_PASSWORD" ]; then

            echo "ERREUR : CM_KEY_PASSWORD absent"

            exit 1

          fi


          echo "Keystore OK"

          echo "Alias = $CM_KEY_ALIAS"

          echo "Chemin keystore présent."



      # ========================================================
      # 3 - FIREBASE
      #
      # Accepte :
      # - google-services.json présent dans GitHub
      # OU
      # - secret ANDROID_FIREBASE_SECRET dans Codemagic.
      #
      # Le secret peut être JSON brut OU Base64.
      # ========================================================

      - name: Préparer Firebase google-services.json

        script: |

          set -e


          echo "===== FIREBASE ====="


          if [ -f "google-services.json" ]; then

            echo "google-services.json trouvé dans le dépôt."

          elif [ -n "$ANDROID_FIREBASE_SECRET" ]; then

            echo "Création de google-services.json depuis le secret Codemagic."


            python3 <<'PY'

          import os
          import json
          import base64
          from pathlib import Path

          value = os.environ.get("ANDROID_FIREBASE_SECRET", "").strip()

          if not value:
              raise SystemExit("ANDROID_FIREBASE_SECRET vide")

          output = Path("google-services.json")

          try:
              parsed = json.loads(value)

              output.write_text(
                  json.dumps(
                      parsed,
                      ensure_ascii=False,
                      indent=2,
                  )
              )

              print("Firebase JSON brut détecté.")

          except Exception:

              try:
                  decoded = base64.b64decode(value).decode("utf-8")

                  json.loads(decoded)

                  output.write_text(decoded)

                  print("Firebase Base64 détecté.")

              except Exception as error:
                  raise SystemExit(
                      f"ANDROID_FIREBASE_SECRET invalide : {error}"
                  )

          PY

          else

            echo "ERREUR : aucune configuration Firebase."

            echo "Ajoute google-services.json à GitHub"

            echo "OU configure ANDROID_FIREBASE_SECRET dans Codemagic."

            exit 1

          fi


          if [ ! -f "google-services.json" ]; then

            echo "ERREUR : google-services.json n'a pas été créé."

            exit 1

          fi


          PACKAGE_NAME=$(jq -r \
            '.client[0].client_info.android_client_info.package_name' \
            google-services.json)


          echo "Package Firebase = $PACKAGE_NAME"

          echo "Package application = $APP_PACKAGE_ID"


          if [ "$PACKAGE_NAME" != "$APP_PACKAGE_ID" ]; then

            echo "ERREUR : package Firebase incorrect."

            echo "Firebase doit utiliser exactement :"

            echo "$APP_PACKAGE_ID"

            exit 1

          fi


          echo "Firebase correctement configuré."



      # ========================================================
      # 4 - CRÉATION ANDROID
      # ========================================================

      - name: Créer le projet Android

        script: |

          set -e

          rm -rf android

          npx cap add android



      # ========================================================
      # 5 - SYNCHRONISATION CAPACITOR
      # ========================================================

      - name: Synchroniser Capacitor et les plugins

        script: |

          set -e

          npx cap sync android


          echo "===== PLUGINS CAPACITOR ====="

          npx cap ls android || true



      # ========================================================
      # 6 - FIREBASE DANS ANDROID
      # ========================================================

      - name: Copier Firebase dans Android

        script: |

          set -e

          cp google-services.json android/app/google-services.json


          test -f android/app/google-services.json


          echo "google-services.json copié."



      # ========================================================
      # 7 - GOOGLE SERVICES GRADLE
      # ========================================================

      - name: Configurer Firebase Gradle

        script: |

          set -e


          python3 <<'PY'

          from pathlib import Path


          root = Path("android/build.gradle")

          app = Path("android/app/build.gradle")


          if not root.exists():
              raise SystemExit("android/build.gradle introuvable")


          if not app.exists():
              raise SystemExit("android/app/build.gradle introuvable")


          root_text = root.read_text()


          google_classpath = (
              "classpath 'com.google.gms:google-services:4.4.4'"
          )


          if "com.google.gms:google-services" not in root_text:

              buildscript_pos = root_text.find("buildscript {")

              if buildscript_pos == -1:
                  raise SystemExit(
                      "Bloc buildscript introuvable dans android/build.gradle"
                  )


              dependencies_pos = root_text.find(
                  "dependencies {",
                  buildscript_pos,
              )


              if dependencies_pos == -1:
                  raise SystemExit(
                      "Bloc dependencies introuvable dans buildscript"
                  )


              insert_pos = (
                  dependencies_pos
                  + len("dependencies {")
              )


              root_text = (
                  root_text[:insert_pos]
                  + "\n        "
                  + google_classpath
                  + "\n"
                  + root_text[insert_pos:]
              )


              root.write_text(root_text)


          app_text = app.read_text()


          plugin_line = (
              "apply plugin: 'com.google.gms.google-services'"
          )


          if plugin_line not in app_text:

              app_text += (
                  "\n"
                  + plugin_line
                  + "\n"
              )


              app.write_text(app_text)


          print("Firebase Gradle configuré.")

          PY


          echo "===== GOOGLE SERVICES ====="

          grep -n "google-services" android/build.gradle || true

          grep -n "google-services" android/app/build.gradle || true



      # ========================================================
      # 8 - API 36
      # ========================================================

      - name: Installer Android API 36

        script: |

          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager "platforms;android-36"

          sdkmanager "build-tools;36.0.0" || true



      # ========================================================
      # 9 - CONFIGURATION SDK
      # ========================================================

      - name: Configurer Android 16 API 36

        script: |

          set -e


          python3 <<'PY'

          from pathlib import Path
          import re


          variables = Path(
              "android/variables.gradle"
          )


          if variables.exists():

              text = variables.read_text()


              text = re.sub(
                  r"compileSdkVersion\s*=\s*\d+",
                  "compileSdkVersion = 36",
                  text,
              )


              text = re.sub(
                  r"targetSdkVersion\s*=\s*\d+",
                  "targetSdkVersion = 36",
                  text,
              )


              variables.write_text(text)


              print(
                  "variables.gradle -> API 36"
              )


          app = Path(
              "android/app/build.gradle"
          )


          if not app.exists():
              raise SystemExit(
                  "android/app/build.gradle introuvable"
              )


          text = app.read_text()


          text = re.sub(
              r"compileSdk\s+\d+",
              "compileSdk 36",
              text,
          )


          text = re.sub(
              r"targetSdk\s+\d+",
              "targetSdk 36",
              text,
          )


          text = re.sub(
              r"versionCode\s+\d+",
              'versionCode Integer.parseInt(System.getenv("APP_VERSION_CODE") ?: "1")',
              text,
          )


          text = re.sub(
              r'versionName\s+"[^"]+"',
              'versionName System.getenv("APP_VERSION_NAME") ?: "1.0.0"',
              text,
          )


          app.write_text(text)


          print(
              "build.gradle -> API 36"
          )

          PY



      # ========================================================
      # 10 - NOM DE L'APPLICATION
      # ========================================================

      - name: Configurer le nom PartenaireFoyer

        script: |

          set -e


          python3 <<'PY'

          from pathlib import Path
          import re


          path = Path(
              "android/app/src/main/res/values/strings.xml"
          )


          if not path.exists():

              raise SystemExit(
                  "strings.xml introuvable"
              )


          text = path.read_text()


          text = re.sub(
              r'<string name="app_name">.*?</string>',
              '<string name="app_name">PartenaireFoyer</string>',
              text,
          )


          text = re.sub(
              r'<string name="title_activity_main">.*?</string>',
              '<string name="title_activity_main">PartenaireFoyer</string>',
              text,
          )


          path.write_text(text)


          print(
              "Nom application = PartenaireFoyer"
          )

          PY



      # ========================================================
      # 11 - ICÔNE + SPLASH SCREEN
      # ========================================================

      - name: Générer l'icône et le splash screen

        script: |

          set -e


          echo "===== ASSETS ====="


          rm -rf assets

          mkdir -p assets


          curl \
            --fail \
            --location \
            --retry 3 \
            "$APP_ICON_URL" \
            -o assets/logo-source.jpg


          # Conversion JPG -> PNG
          sips \
            -s format png \
            assets/logo-source.jpg \
            --out assets/logo.png


          # Capacitor Assets recommande au moins 1024 x 1024.
          sips \
            -z 1024 1024 \
            assets/logo.png


          file assets/logo.png || true


          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "$APP_THEME_COLOR" \
            --iconBackgroundColorDark "$APP_THEME_COLOR" \
            --splashBackgroundColor "#FFFFFF" \
            --splashBackgroundColorDark "#FFFFFF"


          echo "Icônes Android générées."

          echo "Splash Android généré."



      # ========================================================
      # 12 - PERMISSION NOTIFICATIONS
      # ========================================================

      - name: Ajouter les permissions Android Notifications

        script: |

          set -e


          python3 <<'PY'

          from pathlib import Path


          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )


          if not manifest.exists():

              raise SystemExit(
                  "AndroidManifest.xml introuvable"
              )


          text = manifest.read_text()


          permission = (
              '<uses-permission '
              'android:name="android.permission.POST_NOTIFICATIONS" />'
          )


          if (
              "android.permission.POST_NOTIFICATIONS"
              not in text
          ):

              pos = text.find(">")

              if pos == -1:

                  raise SystemExit(
                      "Manifest Android invalide"
                  )


              text = (
                  text[:pos + 1]
                  + "\n    "
                  + permission
                  + "\n"
                  + text[pos + 1:]
              )


          manifest.write_text(text)


          print(
              "POST_NOTIFICATIONS ajouté."
          )

          PY


          grep -n \
            "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml



      # ========================================================
      # 13 - CORRECTION WEBVIEW + INSETS + PERMISSION PUSH
      #
      # - texte 100 %
      # - pas de zoom
      # - viewport mobile respecté
      # - contenu protégé des barres Android / encoche
      # - demande permission notifications Android 13+
      #
      # NE MODIFIE PAS PARTENAIREFOYER.COM
      # ========================================================

      - name: Optimiser la WebView Android

        script: |

          set -e


          python3 <<'PY'

          from pathlib import Path


          root = Path(
              "android/app/src/main/java"
          )


          java_files = list(
              root.rglob("MainActivity.java")
          )


          kotlin_files = list(
              root.rglob("MainActivity.kt")
          )


          if java_files:

              path = java_files[0]

              text = path.read_text()


              imports = """
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          """


              for line in imports.strip().splitlines():

                  clean = line.strip()

                  if clean and clean not in text:

                      package_end = text.find(";")

                      text = (
                          text[:package_end + 1]
                          + "\n"
                          + clean
                          + text[package_end + 1:]
                      )


              if "SITETOAPP_WEBVIEW_CONFIG" not in text:

                  method = """
              // SITETOAPP_WEBVIEW_CONFIG
              @Override
              public void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  WebView webView =
                      getBridge().getWebView();

                  WebSettings settings =
                      webView.getSettings();

                  // Respect du responsive du site.
                  settings.setTextZoom(100);

                  settings.setUseWideViewPort(true);

                  settings.setLoadWithOverviewMode(false);

                  // Pas de zoom forcé Android.
                  settings.setSupportZoom(false);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);


                  // Empêche le contenu d'être caché
                  // sous les barres Android / encoche.
                  ViewCompat.setOnApplyWindowInsetsListener(
                      webView,
                      (view, windowInsets) -> {

                          Insets insets =
                              windowInsets.getInsets(
                                  WindowInsetsCompat.Type.systemBars()
                                  | WindowInsetsCompat.Type.displayCutout()
                              );

                          view.setPadding(
                              insets.left,
                              insets.top,
                              insets.right,
                              insets.bottom
                          );

                          return windowInsets;
                      }
                  );


                  // Android 13+ :
                  // demande réelle de permission notifications.
                  if (
                      Build.VERSION.SDK_INT >= 33
                      &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      ActivityCompat.requestPermissions(
                          this,
                          new String[] {
                              Manifest.permission.POST_NOTIFICATIONS
                          },
                          1001
                      );
                  }
              }
              """


                  last_brace = text.rfind("}")


                  if last_brace == -1:

                      raise SystemExit(
                          "MainActivity.java invalide"
                      )


                  text = (
                      text[:last_brace]
                      + method
                      + "\n"
                      + text[last_brace:]
                  )


              path.write_text(text)


              print(
                  "MainActivity Java optimisée :",
                  path,
              )


          elif kotlin_files:

              path = kotlin_files[0]

              text = path.read_text()


              required_imports = [
                  "import android.Manifest",
                  "import android.content.pm.PackageManager",
                  "import android.os.Build",
                  "import android.os.Bundle",
                  "import androidx.core.app.ActivityCompat",
                  "import androidx.core.content.ContextCompat",
                  "import androidx.core.view.ViewCompat",
                  "import androidx.core.view.WindowInsetsCompat",
              ]


              lines = text.splitlines()


              package_index = 0


              for i, line in enumerate(lines):

                  if line.startswith("package "):

                      package_index = i

                      break


              for imp in required_imports:

                  if imp not in text:

                      lines.insert(
                          package_index + 1,
                          imp,
                      )


              text = "\n".join(lines)


              if "SITETOAPP_WEBVIEW_CONFIG" not in text:

                  method = """
              // SITETOAPP_WEBVIEW_CONFIG
              override fun onCreate(savedInstanceState: Bundle?) {

                  super.onCreate(savedInstanceState)

                  val webView =
                      bridge.webView

                  val settings =
                      webView.settings

                  settings.textZoom = 100

                  settings.useWideViewPort = true

                  settings.loadWithOverviewMode = false

                  settings.setSupportZoom(false)

                  settings.builtInZoomControls = false

                  settings.displayZoomControls = false


                  ViewCompat.setOnApplyWindowInsetsListener(
                      webView
                  ) { view, windowInsets ->

                      val insets =
                          windowInsets.getInsets(
                              WindowInsetsCompat.Type.systemBars()
                              or
                              WindowInsetsCompat.Type.displayCutout()
                          )

                      view.setPadding(
                          insets.left,
                          insets.top,
                          insets.right,
                          insets.bottom
                      )

                      windowInsets
                  }


                  if (
                      Build.VERSION.SDK_INT >= 33
                      &&
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.POST_NOTIFICATIONS
                      )
                      !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(
                              Manifest.permission.POST_NOTIFICATIONS
                          ),
                          1001
                      )
                  }
              }
              """


                  last_brace = text.rfind("}")


                  if last_brace == -1:

                      raise SystemExit(
                          "MainActivity.kt invalide"
                      )


                  text = (
                      text[:last_brace]
                      + method
                      + "\n"
                      + text[last_brace:]
                  )


              path.write_text(text)


              print(
                  "MainActivity Kotlin optimisée :",
                  path,
              )


          else:

              raise SystemExit(
                  "MainActivity Android introuvable"
              )

          PY



      # ========================================================
      # 14 - SIGNATURE RELEASE
      # ========================================================

      - name: Configurer la signature Release

        script: |

          set -e


          cat > android/app/codemagic-release.gradle <<'EOF'

          android {

              signingConfigs {

                  siteToAppRelease {

                      storeFile file(
                          System.getenv("CM_KEYSTORE_PATH")
                      )

                      storePassword System.getenv(
                          "CM_KEYSTORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "CM_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "CM_KEY_PASSWORD"
                      )
                  }
              }


              buildTypes {

                  release {

                      signingConfig signingConfigs.siteToAppRelease

                      minifyEnabled false

                      shrinkResources false
                  }
              }
          }

          EOF


          if ! grep -q \
            'apply from: "codemagic-release.gradle"' \
            android/app/build.gradle; then

            echo "" >> android/app/build.gradle

            echo 'apply from: "codemagic-release.gradle"' \
              >> android/app/build.gradle

          fi


          echo "Signature release configurée."



      # ========================================================
      # 15 - VÉRIFICATIONS AVANT COMPILATION
      # ========================================================

      - name: Vérifier toute la configuration Android

        script: |

          set -e


          echo "===== APPLICATION ====="

          echo "Nom : $APP_NAME"

          echo "Package : $APP_PACKAGE_ID"

          echo "Site : $APP_WEBSITE_URL"

          echo "Version : $APP_VERSION_NAME"

          echo "Version code : $APP_VERSION_CODE"


          echo "===== FIREBASE ====="

          test -f android/app/google-services.json

          jq -r \
            '.client[0].client_info.android_client_info.package_name' \
            android/app/google-services.json


          echo "===== PERMISSION PUSH ====="

          grep \
            "POST_NOTIFICATIONS" \
            android/app/src/main/AndroidManifest.xml


          echo "===== PLUGINS ====="

          npm list @capacitor/push-notifications --depth=0

          npm list @capacitor/splash-screen --depth=0


          echo "===== SIGNATURE ====="

          test -f "$CM_KEYSTORE_PATH"


          echo "===== GRADLE ====="

          cd android

          chmod +x gradlew

          ./gradlew :app:tasks --all >/dev/null


          echo "Configuration Android validée."



      # ========================================================
      # 16 - APK RELEASE
      # ========================================================

      - name: Compiler APK Release signé

        script: |

          set -e

          cd android

          chmod +x gradlew

          ./gradlew clean assembleRelease



      # ========================================================
      # 17 - AAB GOOGLE PLAY
      # ========================================================

      - name: Compiler AAB Google Play signé

        script: |

          set -e

          cd android

          chmod +x gradlew

          ./gradlew bundleRelease



      # ========================================================
      # 18 - CONTRÔLE FINAL
      # ========================================================

      - name: Vérifier les fichiers Google Play

        script: |

          set -e


          echo "================================="

          echo "APK RELEASE"

          echo "================================="


          find \
            android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print


          APK_COUNT=$(find \
            android/app/build/outputs \
            -type f \
            -name "*.apk" \
            | wc -l \
            | tr -d ' ')


          if [ "$APK_COUNT" -eq 0 ]; then

            echo "ERREUR : aucun APK release produit."

            exit 1

          fi


          echo "================================="

          echo "AAB GOOGLE PLAY"

          echo "================================="


          find \
            android/app/build/outputs \
            -type f \
            -name "*.aab" \
            -print


          AAB_COUNT=$(find \
            android/app/build/outputs \
            -type f \
            -name "*.aab" \
            | wc -l \
            | tr -d ' ')


          if [ "$AAB_COUNT" -eq 0 ]; then

            echo "ERREUR : aucun AAB Google Play produit."

            exit 1

          fi


          echo "================================="

          echo "BUILD GOOGLE PLAY TERMINÉ"

          echo "================================="



    artifacts:

      - android/app/build/outputs/**/*.apk

      - android/app/build/outputs/**/*.aab

      - android/app/build/outputs/**/mapping.txt

      - android/app/build/outputs/**/output-metadata.json
